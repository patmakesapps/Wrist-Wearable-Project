; Wrist-controlled rover
;   controller : ESP32 DevKit + GY-521 MPU6050 + vibration motor  (the wearable)
;   rover      : ESP32 DevKit + Adafruit Motor Bonnet + 2x N20     (the printed ship)
;
; Bring-up stages, in order:
;   pio run -e stage1_i2c_scan   -t upload   controller: I2C wiring + WHO_AM_I
;   pio run -e stage2_imu_stream -t upload   controller: live accel/gyro/tilt
;   pio run -e stage3_motor      -t upload   controller: vibration motor
;   pio run -e stage4_espnow_link -t upload  BOTH boards: radio heartbeat
;   pio run -e stage5_bonnet_test -t upload  rover: motor bonnet + N20s
; Then:
;   pio run -e controller -t upload          (default)
;   pio run -e rover      -t upload --upload-port COMx
; On Windows: .\flash.ps1 <env> [-Port COMx] [-Monitor]

[platformio]
default_envs = controller
description  = Wrist-motion controlled rover (ESP32 + MPU6050 + ESP-NOW + Motor Bonnet)

[env]
platform        = espressif32
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
build_flags     = -Wall

; ---------- bring-up stages ----------
[env:stage1_i2c_scan]
build_src_filter = +<stages/01_i2c_scan.cpp>

[env:stage2_imu_stream]
build_src_filter = +<imu.cpp> +<stages/02_imu_stream.cpp>

[env:stage3_motor]
build_src_filter = +<haptics.cpp> +<stages/03_motor_pulse.cpp>

[env:stage4_espnow_link]
build_src_filter = +<link.cpp> +<stages/04_espnow_link.cpp>

[env:stage5_bonnet_test]
build_src_filter = +<bonnet.cpp> +<stages/05_bonnet_test.cpp>

; ---------- firmware ----------
[env:controller]
build_src_filter = +<imu.cpp> +<haptics.cpp> +<link.cpp> +<controller/>

[env:rover]
build_src_filter = +<link.cpp> +<bonnet.cpp> +<rover/>

; stand-alone motion -> buzz demo from the first bring-up (no radio)
[env:standalone]
build_src_filter = +<imu.cpp> +<haptics.cpp> +<motion.cpp> +<standalone/>

; ---------- Waveshare ESP32-S3-LCD-1.47 as the rover brain ----------
; Native USB (no UART bridge), 16 MB flash, 8 MB octal PSRAM. I2C pins differ: see config.h.
[s3lcd]
board       = esp32-s3-devkitc1-n16r8
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:stage4_espnow_link_s3]
extends          = s3lcd
build_src_filter = +<link.cpp> +<stages/04_espnow_link.cpp>

[env:stage5_bonnet_test_s3]
extends          = s3lcd
build_src_filter = +<bonnet.cpp> +<stages/05_bonnet_test.cpp>

[env:rover_s3]
extends          = s3lcd
build_src_filter = +<link.cpp> +<bonnet.cpp> +<rover/>
